; Stride joint firmware. Bare metal: STM32Cube HAL/LL, C11, no Arduino, no RTOS.
;   pio run -e nucleo_f401re -t upload
;   pio test -e native          pure-logic tests on the host, no board needed
[platformio]
default_envs = nucleo_f401re

[env]
build_flags = -std=c11
; src/ only: the HAL and the vendored lib/cfc are not ours to fix
build_src_flags = -Wall -Wextra -Wdouble-promotion

[env:nucleo_f401re]
; same platform as the bring-up
platform = ststm32@19.7.1
board = nucleo_f401re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
; lib/cfc/library.json adds -O2 -ffp-contract=fast to cfc.c and cfc_math.c.
; gc-sections drops cfc_step_backbone and its 86 KB of weights.h, which is never called.
build_flags = ${env.build_flags} -ffunction-sections -fdata-sections -Wl,--gc-sections -DHSE_VALUE=8000000U

[env:native]
platform = native
test_framework = unity
; only the pure logic builds on the host; drivers and main need the HAL
build_src_filter = -<*> +<bldc/> +<cfc_ctrl.c>
test_build_src = yes
build_flags = ${env.build_flags} -Isrc -lm
